server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    sendfile       on;
    tcp_nopush     on;
    aio            threads;
    directio       4m;
    output_buffers 1 128k;

    # Every built asset carries a content hash in its name, so a given URL never changes
    # meaning and may be held for as long as the browser likes.
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # `index.html` names the hashed assets of one particular build, so it must never outlive
        # that build. nginx sets no Cache-Control on static files, which leaves the browser to
        # guess a freshness lifetime from Last-Modified -- and one that guesses days goes on
        # asking for chunks a redeploy has already removed. Those requests 404, the route's
        # dynamic import() rejects, and vue-router abandons the navigation without a word.
        add_header Cache-Control "no-cache";
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
