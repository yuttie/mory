<!DOCTYPE html>
<html lang="en" style="overflow-y: auto; overscroll-behavior: none;">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
    <!-- Cascade layers rank in the order the page first names them, and only `vuetify/styles`
         names Vuetify's; a component's stylesheet names just its own layer. Both the dev server
         and the build's chunking can load a component's CSS first, and then the reset outranks
         every component: its `button { font: inherit }` beat each button's own size. Mirrors the
         head of node_modules/vuetify/lib/styles/main.css; drop it once
         https://github.com/vuetifyjs/vuetify/issues/23135 is fixed. -->
    <style>
        @layer vuetify-core.reset, vuetify-core.base, vuetify-components, vuetify-overrides,
            vuetify-utilities.theme-base, vuetify-utilities.typography, vuetify-utilities.helpers,
            vuetify-utilities.theme-background, vuetify-utilities.theme-foreground,
            vuetify-final.transitions, vuetify-final.trumps;
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <title>%VITE_APP_NAME%</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but %VITE_APP_NAME% doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
