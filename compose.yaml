# Runs the published images on one host, published on localhost unless told otherwise, for a
# reverse proxy in front. It is configured in .env next to this file, begun from .env.template;
# that file holds secrets, so never commit it.
#
#     docker compose up -d                 start, or recreate what changed (.env included)
#     docker compose up -d --pull always   update: recreates only a service whose image changed
#     docker compose restart moried        restart without recreating
#     docker compose logs -f moried
name: mory

services:
    moried:
        image: yuttie/moried:latest
        restart: unless-stopped
        # The owner of the directories below, so moried's commits and cache files belong to that
        # user rather than to root.
        user: "${MORY_UID:?see .env.template}:${MORY_GID:?see .env.template}"
        # All of .env, so a variable the backend gains needs no change here.
        env_file: .env
        environment:
            # These name the mounts and the port below, so they are fixed here. An .env begun
            # from backend/.env.template carries development values for them, which would
            # otherwise win over the image's.
            MORIED_GIT_DIR: /repo
            MORIED_IMAGE_CACHE_DIR: /cache
            MORIED_LISTEN: 0.0.0.0:3030
        ports:
            - "${MORY_BACKEND_ADDRESS:-127.0.0.1:3030}:3030"
        volumes:
            # Host directories rather than named volumes, and none has a default: a named volume
            # starts out owned by root, as does a directory Docker creates for a missing path,
            # and moried runs as MORY_UID.
            - "${MORY_REPO_DIR:?see .env.template}:/repo"
            - "${MORY_CACHE_DIR:?see .env.template}:/cache"
            - "${MORY_HOME_DIR:?see .env.template}:/home"
            - /etc/localtime:/etc/localtime:ro

    mory:
        image: yuttie/mory:latest
        restart: unless-stopped
        # Only what the frontend reads: the rest of .env is the backend's, secrets included.
        environment:
            VITE_APP_APPLICATION_ROOT: ${VITE_APP_APPLICATION_ROOT:-/}
            VITE_APP_API_URL: ${VITE_APP_API_URL:?see .env.template}
        ports:
            - "${MORY_FRONTEND_ADDRESS:-127.0.0.1:8080}:80"
        volumes:
            - /etc/localtime:/etc/localtime:ro
