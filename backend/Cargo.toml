[package]
name = "moried"
version = "1.5.1"
authors = ["Yuta Taniguchi <yuta.taniguchi.y.t@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.69", features = ["backtrace"] }
async-trait = "0.1"
axum = { version = "0.7.5", features = ["macros", "multipart"] }
base64 = "0.22"
base16ct = "0.2.0"
chrono = { version = "0.4.38", features = ["serde"] }
dotenv = "0.15.0"
git2 = { version = "0.19", default-features = false }
httpdate = "1"
icalendar = { version = "0.17.13", features = ["recurrence"] }
jsonwebtoken = "9"
lindera = { version = "5.0.1", features = ["embed-ipadic"] }
lindera-analysis = "5.0.1"
lindera-tantivy = { version = "5.0.1", features = ["embed-ipadic"] }
markdown = "=1.0.0-alpha.20"
mime_guess = "2.0.5"
reqwest = { version = "0.12", features = ["brotli", "gzip", "json", "rustls-tls"] }
rust-argon2 = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34+deprecated"
sha1 = "0.10.6"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tempfile = "3.15.0"
tantivy = "0.26.1"
tokio = { version = "1.39.2", features = ["full"] }
tower = { version = "0.5.0", features = ["buffer", "limit", "load-shed"] }
tower-http = { version = "0.5.2", features = ["compression-gzip", "cors", "sensitive-headers", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1.17.0", features = ["serde"] }
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
chrono-tz = "0.10.4"

[dev-dependencies]
# Used only by the test that checks what the task and event tools emit against
# `frontend/src/metadata-schema.json`, which stays the single copy of that schema.
jsonschema = "0.33"
