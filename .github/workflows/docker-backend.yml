name: moried image
on:
    push:
        branches:
            - main
        # Every build is a new image, since its labels carry the commit and the
        # time, and `docker compose up -d --pull always` recreates a container
        # for it. So only a change to what the Dockerfile copies builds it.
        paths:
            - backend/Cargo.toml
            - backend/Cargo.lock
            - backend/Dockerfile
            - backend/docker/**
            - backend/src/**
            - .github/workflows/docker-backend.yml
    # Weekly, so security fixes to the base image and the packages reach the
    # image while nothing here changes. Monday 03:17 in Tokyo.
    schedule:
        - cron: '17 18 * * 0'
    workflow_dispatch:
# Builds take turns, so two never race for `latest`. A newer push still does
# not cancel one in progress: a build saves its cache only once it finishes,
# so in a burst of merges a cold build would start cold every time.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
permissions:
    contents: read
jobs:
    # The reusable workflow's build-args cannot work out a date, so a job of
    # its own does, in Tokyo time: there the weekly run opens a week, where in
    # UTC it would close one that a push may already have refreshed.
    week:
        runs-on: ubuntu-latest
        outputs:
            week: ${{ steps.week.outputs.week }}
        steps:
            - id: week
              run: echo "week=$(TZ=Asia/Tokyo date +%G-W%V)" >> "$GITHUB_OUTPUT"
    build:
        needs: week
        # Builds each platform on its own runner by default. The Dockerfile's
        # build stage runs on the target platform, so on one runner rustc
        # would run under QEMU for arm64, far slower than on an arm64 runner.
        uses: docker/github-builder/.github/workflows/build.yml@v1
        permissions:
            contents: read
            id-token: write # signs the cache entries, and the attestations when pushing
        with:
            context: backend
            build-args: |
                APT_REFRESH=${{ needs.week.outputs.week }}
            output: image
            # A run started by hand on another branch only checks that it builds.
            push: ${{ github.ref == 'refs/heads/main' }}
            platforms: linux/amd64,linux/arm64
            cache: true
            cache-scope: moried
            # The dependencies are compiled in the build stage, which `min`
            # would leave out of the cache.
            cache-mode: max
            meta-images: yuttie/moried
            # `sha-<commit>` too, so the image a merge replaces as `latest`
            # stays there to go back to. A weekly build is of a commit already
            # tagged, so it gets the date instead, leaving the image before it
            # under that tag to go back to.
            meta-tags: |
                type=raw,value=latest
                type=sha,enable=${{ github.event_name != 'schedule' }}
                type=schedule,pattern={{date 'YYYYMMDD' tz='Asia/Tokyo'}}
            set-meta-labels: true
            # The generated title is the repository's name, which is the
            # frontend's.
            meta-labels: |
                org.opencontainers.image.title=moried
        secrets:
            # DOCKERHUB_TOKEN is a Docker Hub access token of yuttie's, with
            # Read & Write.
            registry-auths: |
                - registry: docker.io
                  username: yuttie
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
