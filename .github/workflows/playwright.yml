name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # The npm project is the frontend; only `run` steps inherit this, so paths
    # handed to actions below stay relative to the repository root.
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      # The browsers `playwright.config.ts` runs: the whole Chromium, without
      # the headless shell, and Firefox. The fonts the pages are drawn in come
      # with `--with-deps` whichever browsers are named.
      run: npx playwright install --with-deps --no-shell chromium firefox
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
