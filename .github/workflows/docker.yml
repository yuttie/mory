name: Docker images
# One workflow for both images, so that one run's success means every image a
# push changed has been built.
on:
    push:
        branches:
            - main
    # Weekly, so security fixes to the base images and moried's packages reach
    # the images while nothing here changes. Monday 03:17 in Tokyo.
    schedule:
        - cron: '17 18 * * 0'
    workflow_dispatch:
# Runs take turns, so two never race for `latest`. A newer push still does
# not cancel one in progress: a build saves its cache only once it finishes,
# so in a burst of merges a cold build would start cold every time.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
permissions:
    contents: read
jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            moried: ${{ steps.images.outputs.moried }}
            mory: ${{ steps.images.outputs.mory }}
            week: ${{ steps.week.outputs.week }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: docker/login-action@v4
              with:
                  username: yuttie
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            # An image is built when what it is built from has changed since
            # the commit its `latest` was built from, which the image's
            # revision label records. Comparing with the push before instead
            # would leave the changes of a run that failed unbuilt for good.
            - id: images
              shell: bash
              run: |
                  set -euo pipefail

                  # Whether a path in the repository reaches the image.
                  moried_reads() {
                      case $1 in
                          backend/Cargo.toml | backend/Cargo.lock | backend/Dockerfile | backend/docker/* | backend/src/*) return 0 ;;
                      esac
                      return 1
                  }
                  mory_reads() {
                      case $1 in
                          # Tests and documentation, which never reach it.
                          frontend/e2e/* | frontend/*.spec.ts | frontend/playwright.config.ts | frontend/vitest.config.ts | frontend/*.md | frontend/docs/*) return 1 ;;
                          frontend/*) return 0 ;;
                      esac
                      return 1
                  }

                  # Whether yuttie/$1:latest is to be built anew.
                  outdated() {
                      local image=$1 built f
                      built=$(docker buildx imagetools inspect "yuttie/$image:latest" \
                          --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.revision" }}') || built=
                      # Nothing to compare with: an image built elsewhere, or
                      # from a commit this repository no longer has.
                      if ! [[ $built =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$built^{commit}"; then
                          return 0
                      fi
                      # A run of an older commit, such as one re-run, must not
                      # take `latest` back.
                      if [ "$built" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$built"; then
                          return 1
                      fi
                      # A weekly or manual run rebuilds for the base images' sake.
                      if [ "$GITHUB_EVENT_NAME" != push ]; then
                          return 0
                      fi
                      while IFS= read -r f; do
                          if [ "$f" = .github/workflows/docker.yml ] || "${image}_reads" "$f"; then
                              return 0
                          fi
                      done < <(git diff --name-only "$built" "$GITHUB_SHA")
                      return 1
                  }

                  for image in moried mory; do
                      if outdated "$image"; then
                          echo "$image=true"
                      else
                          echo "$image=false"
                      fi
                  done | tee -a "$GITHUB_OUTPUT"
            # The reusable workflow's build-args cannot work out a date, so this
            # job does, in Tokyo time: there the weekly run opens a week, where
            # in UTC it would close one that a push may already have refreshed.
            - id: week
              run: echo "week=$(TZ=Asia/Tokyo date +%G-W%V)" >> "$GITHUB_OUTPUT"
    moried:
        needs: prepare
        if: needs.prepare.outputs.moried == 'true'
        # Builds each platform on its own runner by default. The Dockerfile's
        # build stage runs on the target platform, so on one runner rustc
        # would run under QEMU for arm64, far slower than on an arm64 runner.
        uses: docker/github-builder/.github/workflows/build.yml@v1
        permissions:
            contents: read
            id-token: write # signs the cache entries, and the attestations when pushing
        with:
            context: backend
            build-args: |
                APT_REFRESH=${{ needs.prepare.outputs.week }}
            output: image
            # A run started by hand on another branch only checks that it builds.
            push: ${{ github.ref == 'refs/heads/main' }}
            platforms: linux/amd64,linux/arm64
            cache: true
            cache-scope: moried
            # The dependencies are compiled in the build stage, which `min`
            # would leave out of the cache.
            cache-mode: max
            meta-images: yuttie/moried
            # `latest` is left to the promote job. `sha-<commit>` stays, to go
            # back to. A weekly build is of a commit already tagged, so it gets
            # the date instead, leaving the image before it under that tag.
            meta-tags: |
                type=sha,enable=${{ github.event_name != 'schedule' }}
                type=schedule,pattern={{date 'YYYYMMDD' tz='Asia/Tokyo'}}
            set-meta-labels: true
            # The generated title is the repository's name, which is the
            # frontend's.
            meta-labels: |
                org.opencontainers.image.title=moried
        secrets:
            # DOCKERHUB_TOKEN is a Docker Hub access token of yuttie's, with
            # Read & Write.
            registry-auths: |
                - registry: docker.io
                  username: yuttie
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
    mory:
        needs: prepare
        if: needs.prepare.outputs.mory == 'true'
        uses: docker/github-builder/.github/workflows/build.yml@v1
        permissions:
            contents: read
            id-token: write # signs the cache entries, and the attestations when pushing
        with:
            # A Git context, which BuildKit reads without .dockerignore, so
            # `COPY . .` copies every tracked file. Only `dist` leaves that
            # stage, so the image is the same.
            context: frontend
            output: image
            # A run started by hand on another branch only checks that it builds.
            push: ${{ github.ref == 'refs/heads/main' }}
            platforms: linux/amd64,linux/arm64
            # The Dockerfile bundles the app on the build platform, so one
            # runner bundles it once for both platforms, where two would
            # bundle it twice. Only the nginx stage runs under QEMU, and all it
            # runs is `rm` and `chmod`.
            distribute: false
            setup-qemu: true
            cache: true
            cache-scope: mory
            # `npm ci` runs in the build stage, which `min` would leave out of
            # the cache.
            cache-mode: max
            meta-images: yuttie/mory
            meta-tags: |
                type=sha,enable=${{ github.event_name != 'schedule' }}
                type=schedule,pattern={{date 'YYYYMMDD' tz='Asia/Tokyo'}}
            set-meta-labels: true
        secrets:
            registry-auths: |
                - registry: docker.io
                  username: yuttie
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
    # Moves `latest` once every image this run builds has been built, so it
    # moves for both images at once, and for neither when a build fails.
    promote:
        needs:
            - moried
            - mory
        if: >-
            ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main'
            && (needs.moried.result == 'success' || needs.mory.result == 'success') }}
        runs-on: ubuntu-latest
        steps:
            - uses: docker/login-action@v4
              with:
                  username: yuttie
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            # From one index, `create` makes a carbon copy: `latest` gets the
            # very image the build pushed, attestations included.
            - if: needs.moried.result == 'success'
              env:
                  DIGEST: ${{ needs.moried.outputs.digest }}
              run: docker buildx imagetools create --tag yuttie/moried:latest "yuttie/moried@$DIGEST"
            - if: needs.mory.result == 'success'
              env:
                  DIGEST: ${{ needs.mory.outputs.digest }}
              run: docker buildx imagetools create --tag yuttie/mory:latest "yuttie/mory@$DIGEST"
